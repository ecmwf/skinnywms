<!DOCTYPE html>
<html>
<head>
  <link rel="icon" type="image/x-icon" href="static/img/favicon.ico">
  <link rel="stylesheet"
    href="static/css/leaflet-1.3.1.css"
    integrity="sha512-Rksm5RenBEKSKFjgI3a41vrjkw4EVPlJ3+OiI65vTjIdo9brlAacEuKOiQ5OFh7cOI1bkDwLqdLw3Zg0cRJAAQ=="
    crossorigin=""/>
  <link rel="stylesheet"
    href="static/css/leaflet.timedimension.control-1.1.0.min.css"
    integrity="sha512-XYq3haZyzXMyIeexNlcqH1RNTMdoOhgXnzKi29fGpTy0fgzlYVyy/x+cfkkPQSDY7LQG6mRAQAvcv3iC0IYxiA=="
    crossorigin=""/>
  <link rel="stylesheet"
    href="static/css/leaflet-html-legend-0.3.4.css"
    integrity="sha512-qfcZaBG4c15buuUH0ewfe/2h1BVd4txcrhiJJxgJ5EXGP822ibCqpTsJFQyyQp4SEPgQ/Rpj+pLALRJXXVrH6w=="
    crossorigin=""/>
  <!-- Make sure you put this AFTER Leaflet's CSS -->
  <script src="static/js/leaflet-1.3.1.js"
    integrity="sha512-/Nsx9X4HebavoBvEBuyp3I7od5tA0UzAxs+j83KgC8PU0kgB4XiK4Lfe4y4cgBtaRJQEIFCW+oC506aPT2L1zw=="
    crossorigin=""></script>
  <script
    src="static/js/jquery-1.12.4.js"
    integrity="sha256-Qw82+bXyGq6MydymqBxNPYTaUXXq7c8v3CwiYwLLNXU="
    crossorigin="anonymous"></script>

  <script
    src="static/js/iso8601-js-period-0.2.1.min.js"
    integrity="sha512-H9EnpWO2b9EDf/ViaCEoxOZRB6AcYaeLIqg8O5R0vIu4MfqUhb7sL/8kFh9jnzZ5vixgd21PF9TWppxU1hSeeQ=="
    crossorigin="anonymous"></script>
  <script
    src="static/js/leaflet.timedimension-1.1.0.min.js"
    integrity="sha512-NDftc6C1NxjJ6WhbWV4/RIJHN8DLylJUWhBKJC8bHROOoTqCvfh9GRuplnTgiBIDWHudOreTmFWT4FlCDn5Gag=="
    crossorigin="anonymous"></script>
  <script
    src="static/js/leaflet-html-legend-0.3.4.js"
    integrity="sha512-FLz9Z0kdR5I6tKaWty9NTrMZHDONCIrHA2mkGjsyg6rZgIHnPqQu7ahpC/KtOWPj7Xl2wdaDC9ngOWSk9/qv7Q=="
    crossorigin="anonymous"></script>
</head>
<body>
  <div id="viewport">
    <div id="mapid"></div>
    <img id="staticmap" alt="Static WMS preview">
    <div id="crs-control" class="crs-control crs-control-standalone">
      <span>Projection:</span>
      <select id="crs-select"></select>
    </div>
  </div>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    #viewport {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #mapid, #staticmap {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
    }
    #staticmap {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #ccc;
    }
    .leaflet-html-legend {
      width: auto;
      max-width: 50%;
      min-width: 250px;
    }
    div.legend img {
      width: 100%;
      background-color: gray;
    }
    .crs-control {
      background: white;
      padding: 4px 8px;
      font: 12px/1.4 "Helvetica Neue", Arial, sans-serif;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      border-radius: 4px;
    }
    .crs-control select {
      margin-left: 4px;
    }
    /* Only used while no Leaflet map is active (static CRS preview), since
       Leaflet then has no top-left control container to stack us into. */
    .crs-control.crs-control-standalone {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
    }
    .leaflet-control-basedate {
      background: #fff;
      padding: 5px 7px;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.4);
      font: 12px/1.4 "Helvetica Neue", Arial, Helvetica, sans-serif;
    }
    .leaflet-control-basedate label {
      display: block;
      margin-bottom: 3px;
      font-weight: bold;
    }
    .leaflet-control-basedate select {
      font: inherit;
      max-width: 220px;
    }
  </style>
  <script>
      /* patch for leaflet time dimension bug, see https://github.com/socib/Leaflet.TimeDimension/issues/139 */
      let parseTimeDimensionFromCapabilitiesFix = function(xml) {
          var layers = xml.querySelectorAll('Layer');
          var layerName = this._baseLayer.wmsParams.layers;
          var layer = null, times = null;
          layers.forEach(function(current) {
              if (current.querySelector("Name") && current.querySelector("Name").innerHTML === layerName)
                  layer = current;
          })
          if (layer) {
              times = this._getTimesFromLayerCapabilities(layer);
              if (!times)
                  times = this._getTimesFromLayerCapabilities(layer.parentNode);
          }
          return times;
      }

      /* CRSs Leaflet can tile natively with a real global slippy-map grid.
         Anything else GetCapabilities advertises (e.g. a polar stereographic or
         Equal Earth) doesn't have a rectangular valid area that lines up with a
         square tile grid, so it's rendered as a single static full-extent image
         instead - no pan/zoom, but a correct one-shot look at what the WMS
         backend (Magics) actually produces for that CRS. */
      function isTileable(code) {
          return code === 'EPSG:4326' || code === 'EPSG:3857';
      }

      /* 'YYYY-MM-DD HHZ', which is how forecasters name a run */
      let formatBaseDate = function(date) {
          let iso = new Date(date).toISOString();
          return iso.substring(0, 10) + ' ' + iso.substring(11, 13) + 'Z';
      }

      /* Lets the user pick which forecast run to look at, i.e. a value for the
         reference_time dimension, sent as DIM_REFERENCE_TIME. Only shown when a
         visible layer offers more than one run. */
      let BaseDateControl = L.Control.extend({
          options: {
              position: 'topright',
              onChange: function(value) {},
          },

          initialize: function(options) {
              L.setOptions(this, options);
              this._dates = [];
              this._selected = null;
          },

          onAdd: function() {
              this._container = L.DomUtil.create('div', 'leaflet-control-basedate');
              let label = L.DomUtil.create('label', '', this._container);
              label.innerHTML = 'Base date';
              label.setAttribute('for', 'basedate-select');
              this._select = L.DomUtil.create('select', '', this._container);
              this._select.id = 'basedate-select';
              /* the map must not pan or zoom while the dropdown is being used */
              L.DomEvent.disableClickPropagation(this._container);
              L.DomEvent.disableScrollPropagation(this._container);
              L.DomEvent.on(this._select, 'change', function() {
                  this._selected = this._select.value;
                  this.options.onChange(this._selected);
              }, this);
              this._render();
              return this._container;
          },

          /* dates are epoch milliseconds, as parseTimesExpression returns them,
             selected is one of their ISO 8601 representations */
          setDates: function(dates, selected) {
              this._dates = dates;
              this._selected = selected;
              this._render();
              return this;
          },

          getSelected: function() {
              return this._selected;
          },

          _render: function() {
              if (!this._container) {
                  return;
              }
              this._select.innerHTML = '';
              this._dates.forEach(function(date) {
                  let option = L.DomUtil.create('option', '', this._select);
                  option.value = new Date(date).toISOString();
                  option.text = formatBaseDate(date);
                  option.selected = (option.value === this._selected);
              }, this);
              this._container.style.display = this._dates.length > 1 ? '' : 'none';
          },
      });

      /* Root-level <CRS> + matching <BoundingBox CRS="..."> from GetCapabilities. */
      function parseCrsList($xml) {
          let $rootLayer = $xml.find('Capability > Layer').first();
          let crsList = [];
          $rootLayer.find('> CRS').each(function() {
              let code = $(this).text();
              let $bbox = $rootLayer.find('> BoundingBox[CRS="' + code + '"]').first();
              let bounds = null;
              if ($bbox.length) {
                  let minx = parseFloat($bbox.attr('minx'));
                  let miny = parseFloat($bbox.attr('miny'));
                  let maxx = parseFloat($bbox.attr('maxx'));
                  let maxy = parseFloat($bbox.attr('maxy'));
                  /* some advertised CRSs (e.g. the polar ones) report min > max */
                  bounds = {
                      minx: Math.min(minx, maxx),
                      maxx: Math.max(minx, maxx),
                      miny: Math.min(miny, maxy),
                      maxy: Math.max(miny, maxy),
                  };
              }
              crsList.push({code: code, bounds: bounds});
          });
          return crsList;
      }

      /* Non-background layer names advertised, used to build the single
         combined image shown for non-tileable CRSs. */
      function parseDataLayerNames($xml) {
          let names = [];
          $xml.find('Layer').each(function() {
              let name = $(this).find('> Name').text();
              if (name && name !== 'background') {
                  names.push(name);
              }
          });
          return names;
      }

      function populateCrsSelect(crsList, currentCode, onChange) {
          let select = document.getElementById('crs-select');
          select.innerHTML = '';
          crsList.forEach(function(entry) {
              let opt = document.createElement('option');
              opt.value = entry.code;
              if (!entry.bounds) {
                  opt.disabled = true;
                  opt.textContent = entry.code + ' (no bounding box)';
              } else {
                  opt.textContent = entry.code + (isTileable(entry.code) ? '' : ' (static preview)');
              }
              if (entry.code === currentCode) {
                  opt.selected = true;
              }
              select.appendChild(opt);
          });
          select.onchange = function() {
              onChange(select.value);
          };
      }

      function showStaticPreview(crsCode, bounds, dataLayerNames) {
          document.getElementById('mapid').style.display = 'none';
          let img = document.getElementById('staticmap');
          img.style.display = '';

          let width = 800;
          let aspect = (bounds.maxx - bounds.minx) / (bounds.maxy - bounds.miny);
          let height = Math.max(1, Math.round(width / aspect));
          let layers = ['background'].concat(dataLayerNames).join(',');
          let bbox = [bounds.minx, bounds.miny, bounds.maxx, bounds.maxy].join(',');

          img.src = '/wms?service=WMS&version=1.3.0&request=GetMap&format=image/png'
              + '&transparent=TRUE&layers=' + encodeURIComponent(layers)
              + '&crs=' + encodeURIComponent(crsCode)
              + '&bbox=' + bbox
              + '&width=' + width + '&height=' + height;
      }

      let mymap = null;
      let layers = {};
      let legends = {};
      let layerMeta = {};
      let baseDateControl = null;

      /* Snapshot of the interactive map right before it's torn down, so a
         projection switch can restore it afterwards instead of resetting the
         UI to its initial state. Only meaningful when mymap is an interactive
         (tileable) map - a static preview has no per-layer selection. */
      function captureMapState() {
          if (!mymap) {
              return null;
          }
          let selectedLayerNames = Object.keys(layerMeta).filter(function(label) {
              return mymap.hasLayer(layerMeta[label].layer);
          }).map(function(label) {
              return layerMeta[label].name;
          });

          return {
              center: mymap.getCenter(),
              zoom: mymap.getZoom(),
              selectedLayerNames: selectedLayerNames,
              currentTime: mymap.timeDimension ? mymap.timeDimension.getCurrentTime() : null,
              baseDate: baseDateControl ? baseDateControl.getSelected() : null,
          };
      }

      /* Re-selects the overlays that were visible before the switch. Fires
         'overlayadd' manually (mirrors what L.Control.Layers does on a
         checkbox click) since addLayer() alone doesn't raise it, and the
         legend/time-dimension bookkeeping in buildInteractiveMap relies on it. */
      function restoreMapState(savedState) {
          if (!savedState || !savedState.selectedLayerNames.length) {
              return;
          }
          Object.keys(layerMeta).forEach(function(label) {
              let meta = layerMeta[label];
              if (savedState.selectedLayerNames.indexOf(meta.name) !== -1) {
                  mymap.addLayer(meta.layer);
                  mymap.fire('overlayadd', { layer: meta.layer, name: label });
              }
          });
          if (savedState.currentTime && mymap.timeDimension) {
              mymap.timeDimension.setCurrentTime(savedState.currentTime);
          }
      }

      /* Wraps the existing #crs-control div as a real Leaflet control so it
         stacks below the zoom control automatically (same top-left corner,
         Leaflet's own control spacing) instead of hand-placed pixel offsets.
         mymap is torn down and rebuilt on every CRS switch, so the div is
         moved back out to #viewport (see detachCrsControl) before that
         happens rather than relying on Control.onRemove, which Leaflet's
         Map.remove() does not reliably invoke. */
      let CrsControl = L.Control.extend({
          options: { position: 'topleft' },
          onAdd: function() {
              let el = document.getElementById('crs-control');
              el.classList.remove('crs-control-standalone');
              if (!el.dataset.propagationDisabled) {
                  L.DomEvent.disableClickPropagation(el);
                  L.DomEvent.disableScrollPropagation(el);
                  el.dataset.propagationDisabled = 'true';
              }
              return el;
          }
      });

      function detachCrsControl() {
          let el = document.getElementById('crs-control');
          if (el.parentElement && el.parentElement.id !== 'viewport') {
              document.getElementById('viewport').appendChild(el);
          }
          el.classList.add('crs-control-standalone');
      }

      function buildInteractiveMap(crsCode, crsList, dataLayerNames, $xml, savedState) {
          document.getElementById('staticmap').style.display = 'none';
          document.getElementById('mapid').style.display = '';

          if (mymap) {
              mymap.remove();
          }

          mymap = L.map('mapid', {
              center: savedState ? savedState.center : [0, 0],
              zoom: savedState ? savedState.zoom : 2,
              crs: crsCode === 'EPSG:3857' ? L.CRS.EPSG3857 : L.CRS.EPSG4326,
              timeDimension: true,
              timeDimensionControl: true,
              zoomControl: false,
          });

          /* Added in this order so Leaflet stacks the zoom buttons below the
             projection control within the shared top-left corner. */
          new CrsControl().addTo(mymap);
          L.control.zoom({ position: 'topleft' }).addTo(mymap);

          let background = L.tileLayer.wms('/wms?', {
              layers: 'background',
              format: 'image/png',
              transparent: 'TRUE',
              attribution: '',
              version: '1.3.0'
          }).addTo(mymap);

          layers = {};
          legends = {};
          layerMeta = {};

          function setTimeControlVisible(visible) {
            let control = document.querySelector('.leaflet-control-timecontrol');
            if (control) {
              control.style.display = visible ? '' : 'none';
            }
          }

          function updateVisibleLayerTimes() {
            let visibleTimedLayers = [];
            let mergedTimes = [];

            Object.keys(layerMeta).forEach(function(label) {
              let meta = layerMeta[label];
              if (!meta.hasTimeDimension || !mymap.hasLayer(meta.layer)) {
                return;
              }

              visibleTimedLayers.push(meta);

              let parsedTimes = L.TimeDimension.Util.parseTimesExpression(meta.timeExtent);
              if (mergedTimes.length === 0) {
                mergedTimes = parsedTimes;
              } else {
                mergedTimes = L.TimeDimension.Util.union_arrays(mergedTimes, parsedTimes);
              }
            });

            if (visibleTimedLayers.length === 0) {
              mymap.timeDimension.setAvailableTimes([], 'replace');
              setTimeControlVisible(false);
              return;
            }

            mymap.timeDimension.setAvailableTimes(mergedTimes, 'replace');
            setTimeControlVisible(true);
          }

          function applyBaseDate(value) {
            Object.keys(layerMeta).forEach(function(label) {
              let meta = layerMeta[label];
              if (!meta.hasReferenceTimeDimension || !mymap.hasLayer(meta.layer)) {
                return;
              }
              /* on a time dimension layer this also reaches the layers already
                 cached for other times, and invalidates them */
              meta.layer.setParams({DIM_REFERENCE_TIME: value});
            });
          }

          function updateVisibleBaseDates() {
            let mergedDates = [];
            let defaultDate = null;

            Object.keys(layerMeta).forEach(function(label) {
              let meta = layerMeta[label];
              if (!meta.hasReferenceTimeDimension || !mymap.hasLayer(meta.layer)) {
                return;
              }

              let parsedDates = L.TimeDimension.Util.parseTimesExpression(
                meta.referenceTimeExtent);
              if (mergedDates.length === 0) {
                mergedDates = parsedDates;
              } else {
                mergedDates = L.TimeDimension.Util.union_arrays(mergedDates, parsedDates);
              }

              if (defaultDate === null && meta.defaultReferenceTime) {
                defaultDate = new Date(meta.defaultReferenceTime).toISOString();
              }
            });

            let available = mergedDates.map(function(date) {
              return new Date(date).toISOString();
            });

            if (available.length === 0) {
              /* nothing to choose from yet: hide the control but hold on to the
                 selection, so a layer toggled off and on again, or replayed by
                 restoreMapState after a projection switch, keeps its run */
              baseDateControl.setDates([], baseDateControl.getSelected());
              return;
            }

            /* keep the run the user chose if the visible layers still offer it,
               else fall back to the one the server advertises as default */
            let selected = baseDateControl.getSelected();
            if (available.indexOf(selected) < 0) {
              selected = available.indexOf(defaultDate) >= 0 ?
                defaultDate : available[available.length - 1];
            }

            baseDateControl.setDates(mergedDates, selected);
            if (selected) {
              applyBaseDate(selected);
            }
          }

          $xml.find('Layer').each(function() {
              let name = $(this).find('> Name').text();
              let title = $(this).find('> Title').text();
              let label = title || name;
              let legendurl = $(this).find("> Style > LegendUrl > OnlineResource").attr("xlink:href");
              let timeDimension = $(this).find('> Dimension[name="time"]');
              let timeExtent = timeDimension.text();
              let defaultTime = timeDimension.attr('default');
              let hasTimeDimension = timeDimension.length > 0 && timeExtent != "";
              let referenceTimeDimension = $(this).find('> Dimension[name="reference_time"]');
              let referenceTimeExtent = referenceTimeDimension.text();
              let defaultReferenceTime = referenceTimeDimension.attr('default');
              let hasReferenceTimeDimension =
                  referenceTimeDimension.length > 0 && referenceTimeExtent != "";

              if (name == "background" || name == "")
                  return;

              let wmslayer = L.tileLayer.wms("/wms", {
                  layers: name,
                  format: 'image/png',
                  transparent: true,
                  version: "1.3.0",
              });

              let overlayLayer = hasTimeDimension ? L.timeDimension.layer.wms(wmslayer, {
                  updateTimeDimension: true,
                  updateTimeDimensionMode: 'union',
                  requestTimeFromCapabilities: true,
              }) : wmslayer;

              if (hasTimeDimension) {
                  overlayLayer._parseTimeDimensionFromCapabilities = parseTimeDimensionFromCapabilitiesFix;
              }

              layers[label] = overlayLayer;
              layerMeta[label] = {
                  name: name,
                  title: label,
                  hasTimeDimension: hasTimeDimension,
                  timeExtent: timeExtent,
                  defaultTime: defaultTime,
                  hasReferenceTimeDimension: hasReferenceTimeDimension,
                  referenceTimeExtent: referenceTimeExtent,
                  defaultReferenceTime: defaultReferenceTime,
                  layer: overlayLayer,
              };

              if (legendurl){
                  let legendControl = L.control.htmllegend({
                      position: 'bottomright',
                      legends: [{
                          name: label + " (" + name + ")",
                          elements: [{
                              label: "&nbsp;",
                              html: '<div class="legend"><img src="' + legendurl + '"/></div>'
                          }]
                      }],
                      defaultOpacity: 0.8,
                      collapseSimple: true,
                      collapsedOnInit: true,
                      detectStretched: true
                  });
                  legends[label] = legendControl;
              }
          });

          let baseMaps = {
              "background": background,
          };
          L.control.layers(baseMaps, layers).addTo(mymap);
          setTimeControlVisible(false);

          baseDateControl = new BaseDateControl({
              onChange: applyBaseDate,
          }).addTo(mymap);
          /* seed the previous choice so the overlays replayed by
             restoreMapState keep the run instead of resetting to the default */
          if (savedState && savedState.baseDate) {
              baseDateControl.setDates([], savedState.baseDate);
          }
          updateVisibleBaseDates();

          mymap.on('overlayadd', function(eventLayer) {
              let meta = layerMeta[eventLayer.name];
              if (meta && meta.hasTimeDimension) {
                updateVisibleLayerTimes();
              }
              if (meta && meta.hasReferenceTimeDimension) {
                updateVisibleBaseDates();
              }
              if (legends[eventLayer.name]){
                  legends[eventLayer.name].addTo(this);
              }
          });

          mymap.on('overlayremove', function(eventLayer) {
              let meta = layerMeta[eventLayer.name];
              if (meta && meta.hasTimeDimension) {
                updateVisibleLayerTimes();
              }
              if (meta && meta.hasReferenceTimeDimension) {
                updateVisibleBaseDates();
              }
              if (legends[eventLayer.name]){
                  this.removeControl(legends[eventLayer.name]);
              }
          });

          restoreMapState(savedState);
      }

      function switchCrs(crsCode, crsList, dataLayerNames, $xml) {
          detachCrsControl();
          let savedState = captureMapState();
          if (mymap) {
              mymap.remove();
              mymap = null;
          }

          if (isTileable(crsCode)) {
              buildInteractiveMap(crsCode, crsList, dataLayerNames, $xml, savedState);
              return;
          }

          let entry = crsList.find(function(c) { return c.code === crsCode; });
          if (!entry || !entry.bounds) {
              alert('Projection ' + crsCode + ' has no usable bounding box and cannot be previewed.');
              return;
          }
          showStaticPreview(crsCode, entry.bounds, dataLayerNames);
      }

      fetch('/wms?request=GetCapabilities&service=WMS&version=1.3.0').then(function(response) {
          return response.text();
      }).then(function(text) {
          let $xml = $($.parseXML(text));
          /* Magics currently rejects GetMap requests for every advertised CRS
             that isn't natively tileable (each for a different reason), so
             hide those from the dropdown for now rather than offer a preview
             that's known to fail. */
          let crsList = parseCrsList($xml).filter(function(entry) { return isTileable(entry.code); });
          let dataLayerNames = parseDataLayerNames($xml);
          let defaultCode = 'EPSG:4326';

          populateCrsSelect(crsList, defaultCode, function(newCode) {
              switchCrs(newCode, crsList, dataLayerNames, $xml);
          });
          switchCrs(defaultCode, crsList, dataLayerNames, $xml);
      });
  </script>
</body>
</html>
