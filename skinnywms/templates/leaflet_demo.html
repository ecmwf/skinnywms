    href="static/css/leaflet.timedimension.control-1.1.0.min.css" 
    integrity="sha512-XYq3haZyzXMyIeexNlcqH1RNTMdoOhgXnzKi29fGpTy0fgzlYVyy/x+cfkkPQSDY7LQG6mRAQAvcv3iC0IYxiA=="
    crossorigin=""/>

    crossorigin=""/>
  <!-- Make sure you put this AFTER Leaflet's CSS -->
  <script src="static/js/leaflet-1.3.1.js"
    integrity="sha512-/Nsx9X4HebavoBvEBuyp3I7od5tA0UzAxs+j83KgC8PU0kgB4XiK4Lfe4y4cgBtaRJQEIFCW+oC506aPT2L1zw=="
    crossorigin=""></script>
  <script
    src="static/js/jquery-1.12.4.js"
    integrity="sha256-Qw82+bXyGq6MydymqBxNPYTaUXXq7c8v3CwiYwLLNXU="
    crossorigin="anonymous"></script>

  <script
    src="static/js/iso8601-js-period-0.2.1.min.js"
    integrity="sha512-H9EnpWO2b9EDf/ViaCEoxOZRB6AcYaeLIqg8O5R0vIu4MfqUhb7sL/8kFh9jnzZ5vixgd21PF9TWppxU1hSeeQ=="
    crossorigin="anonymous"></script>
  <script
    src="static/js/leaflet.timedimension-1.1.0.min.js"
    integrity="sha512-NDftc6C1NxjJ6WhbWV4/RIJHN8DLylJUWhBKJC8bHROOoTqCvfh9GRuplnTgiBIDWHudOreTmFWT4FlCDn5Gag=="
    crossorigin="anonymous"></script>
  <script
    src="static/js/leaflet-html-legend-0.3.4.js"
    integrity="sha512-FLz9Z0kdR5I6tKaWty9NTrMZHDONCIrHA2mkGjsyg6rZgIHnPqQu7ahpC/KtOWPj7Xl2wdaDC9ngOWSk9/qv7Q=="
    crossorigin="anonymous"></script>
</head>
<body>
  <div id="mapid"></div>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }
    #mapid {
      height: 100%;
    }
    .leaflet-html-legend {
      width: auto;
      max-width: 50%;
      min-width: 250px;
    }
    div.legend img {
      width: 100%;
      background-color: gray;
    }
  </style>
  <script>
      /* patch for leaflet time dimension bug, see https://github.com/socib/Leaflet.TimeDimension/issues/139 */
      let parseTimeDimensionFromCapabilitiesFix = function(xml) {
          var layers = xml.querySelectorAll('Layer');
          var layerName = this._baseLayer.wmsParams.layers;
          var layer = null, times = null;
          layers.forEach(function(current) {
              if (current.querySelector("Name") && current.querySelector("Name").innerHTML === layerName)
                  layer = current;
          })
          if (layer) {
              times = this._getTimesFromLayerCapabilities(layer);
              if (!times)
                  times = this._getTimesFromLayerCapabilities(layer.parentNode);
          }
          return times;
      }

      let mymap = L.map('mapid', {
          center: [0, 0],
          zoom: 2,
          crs: L.CRS.EPSG4326,
          timeDimension: true,
          timeDimensionControl: true,
      });
      let background = L.tileLayer.wms('/wms?', {
          layers: 'background',
          format: 'image/png',
          transparent: 'TRUE',
          attribution: '',
          version: '1.3.0'
      }).addTo(mymap);

      fetch('/wms?request=GetCapabilities&service=WMS&version=1.3.0').then(function(response) {
          return response.text();
      }).then(function(text) {
          let layers = {}
          let legends = {}
          let layerMeta = {}
          let $xml = $($.parseXML(text));

          function setTimeControlVisible(visible) {
            let control = document.querySelector('.leaflet-control-timecontrol');
            if (control) {
              control.style.display = visible ? '' : 'none';
            }
          }

          function updateVisibleLayerTimes() {
            let visibleTimedLayers = [];
            let mergedTimes = [];

            Object.keys(layerMeta).forEach(function(label) {
              let meta = layerMeta[label];
              if (!meta.hasTimeDimension || !mymap.hasLayer(meta.layer)) {
                return;
              }

              visibleTimedLayers.push(meta);

              let parsedTimes = L.TimeDimension.Util.parseTimesExpression(meta.timeExtent);
              if (mergedTimes.length === 0) {
                mergedTimes = parsedTimes;
              } else {
                mergedTimes = L.TimeDimension.Util.union_arrays(mergedTimes, parsedTimes);
              }
            });

            if (visibleTimedLayers.length === 0) {
              mymap.timeDimension.setAvailableTimes([], 'replace');
              setTimeControlVisible(false);
              return;
            }

            mymap.timeDimension.setAvailableTimes(mergedTimes, 'replace');
            setTimeControlVisible(true);
          }

          $xml.find('Layer').each(function() {
              let name = $(this).find('> Name').text();
              let title = $(this).find('> Title').text();
              let label = title || name;
              let legendurl = $(this).find("> Style > LegendUrl > OnlineResource").attr("xlink:href");
              let timeDimension = $(this).find('> Dimension[name="time"]');
              let timeExtent = timeDimension.text();
              let defaultTime = timeDimension.attr('default');
              let hasTimeDimension = timeDimension.length > 0 && timeExtent != "";

              if (name == "background" || name == "")
                  return;

              let wmslayer = L.tileLayer.wms("/wms", {
                  layers: name,
                  format: 'image/png',
                  transparent: true,
                  version: "1.3.0",
              });

              let overlayLayer = hasTimeDimension ? L.timeDimension.layer.wms(wmslayer, {
                  updateTimeDimension: true,
                  updateTimeDimensionMode: 'union',
                  requestTimeFromCapabilities: true,
              }) : wmslayer;

              if (hasTimeDimension) {
                  overlayLayer._parseTimeDimensionFromCapabilities = parseTimeDimensionFromCapabilitiesFix;
              }

              layers[label] = overlayLayer;
              layerMeta[label] = {
                  name: name,
                  title: label,
                  hasTimeDimension: hasTimeDimension,
                  timeExtent: timeExtent,
                  defaultTime: defaultTime,
                  layer: overlayLayer,
              };

              if (legendurl){
                  let legendControl = L.control.htmllegend({
                      position: 'bottomright',
                      legends: [{
                          name: label + " (" + name + ")",
                          elements: [{
                              label: "&nbsp;",
                              html: '<div class="legend"><img src="' + legendurl + '"/></div>'
                          }]
                      }],
                      defaultOpacity: 0.8,
                      collapseSimple: true,
                      collapsedOnInit: true,
                      detectStretched: true
                  });
                  legends[label] = legendControl;
              }
          });

          let baseMaps = {
              "background": background,
          };
          L.control.layers(baseMaps, layers).addTo(mymap);
            setTimeControlVisible(false);

          mymap.on('overlayadd', function(eventLayer) {
              let meta = layerMeta[eventLayer.name];
              if (meta && meta.hasTimeDimension) {
                updateVisibleLayerTimes();
              }
              if (legends[eventLayer.name]){
                  legends[eventLayer.name].addTo(this);
              }
          });

          mymap.on('overlayremove', function(eventLayer) {
              let meta = layerMeta[eventLayer.name];
              if (meta && meta.hasTimeDimension) {
                updateVisibleLayerTimes();
              }
              if (legends[eventLayer.name]){
                  this.removeControl(legends[eventLayer.name]);
              }
          });
      });
  </script>
</body>
</html>
