services:
  skinnywms:
    build:
      context: ./
      dockerfile: Dockerfile
      args:
        - PYTHON_IMAGE=python:3.14-slim-trixie
        - http_proxy
        - https_proxy
        - no_proxy
    volumes:
      - ".:/app/skinnywms:ro"
      - "./skinnywms/testdata:/data:ro"
      # - "./testdata-metno:/data:ro"
    restart: always
    ports:
      - 5000:5000
    env_file:
      - ./.env
    # environment: 
    #   - SKINNYWMS_DATA_PATH=${SKINNYWMS_DATA_PATH}
    #   - SKINNYWMS_HOST=${SKINNYWMS_HOST}
    #   - SKINNYWMS_PORT=${SKINNYWMS_PORT}
    #   - FLASK_ENV=${FLASK_ENV}
